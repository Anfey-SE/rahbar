name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            fastapi uvicorn pydantic httpx chromadb-client redis \
            pytest pytest-asyncio ruff mypy \
            pyyaml pdfplumber

      - name: Lint (ruff)
        run: ruff check api indexer eval corpus

      - name: Type-check (mypy)
        run: |
          cd api && mypy app
          cd ../indexer && mypy pipeline

      - name: Unit tests
        run: |
          cd api && python -m pytest -q
          cd ../indexer && python -m pytest -q

  validate-manifests:
    name: validate-manifests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin
          kubeconform -v

      - name: Validate base manifests
        run: |
          kubeconform -strict -ignore-missing-schemas -summary \
            k8s/base/*.yaml k8s/overlays/dev/*.yaml k8s/overlays/prod/*.yaml

  scan:
    name: scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: filesystem
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
