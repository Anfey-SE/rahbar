apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  RETRIEVER: "chroma"
  EMBED_PROVIDER: "ollama"
  EMBED_MODEL: "nomic-embed-text"
  LLM_PROVIDER: "ollama-host"
  LLM_MODEL: "llama3.2:3b"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  RELEVANCE_FLOOR: "0.60"
  CHUNK_SIZE: "600"
  CHUNK_OVERLAP: "100"
  TOP_K: "5"
  CACHE_THRESHOLD: "0.92"
