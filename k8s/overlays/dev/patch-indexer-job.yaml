apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
  namespace: rahbar
spec:
  template:
    spec:
      containers:
        - name: indexer
          args:
            - python
            - -m
            - pipeline.run
          env:
            - name: CORPUS_DIR
              value: /corpus/fixtures
          volumeMounts:
            - name: fixture-volume
              mountPath: /corpus/fixtures
      volumes:
        - name: fixture-volume
          configMap:
            name: fixture-corpus
