apiVersion: batch/v1
kind: Job
metadata:
  name: eval-job
  namespace: rahbar
  labels:
    app.kubernetes.io/name: eval-job
    app.kubernetes.io/part-of: rahbar
    rahbar/role: eval
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eval-job
    spec:
      restartPolicy: Never
      serviceAccountName: api-sa
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eval
          image: rahbar-api:dev
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              python -m eval.suite
              --golden eval/golden.jsonl
              --api http://api
              --collection rahbar
              --out /data/results &&
              python scripts/release_gate.py
              --config /etc/gate/thresholds.yaml
              --results /data/results/latest.json
          envFrom:
            - configMapRef:
                name: rahbar-config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: gate-config
              mountPath: /etc/gate
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: gate-config
          configMap:
            name: gate-thresholds
        - name: data
          persistentVolumeClaim:
            claimName: rahbar-data
        - name: tmp
          emptyDir: {}
