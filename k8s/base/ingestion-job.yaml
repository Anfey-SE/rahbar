apiVersion: batch/v1
kind: Job
metadata:
  name: ingest
  namespace: rahbar
  labels:
    app.kubernetes.io/name: ingest
    app.kubernetes.io/part-of: rahbar
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest
    spec:
      restartPolicy: OnFailure
      serviceAccountName: indexer-sa
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          args:
            - python
            - -m
            - pipeline.run
            - --input
            - /data/inbox
            - --data-dir
            - /data
            - --collection
            - rahbar
          envFrom:
            - configMapRef:
                name: rahbar-config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rahbar-data
        - name: tmp
          emptyDir: {}
