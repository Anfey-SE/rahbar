apiVersion: batch/v1
kind: Job
metadata:
  name: ingestion-job
  namespace: rahbar
  labels:
    app.kubernetes.io/name: ingestion-job
    app.kubernetes.io/part-of: rahbar
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-job
    spec:
      restartPolicy: OnFailure
      serviceAccountName: indexer-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - name: DATA_LAKE_PATH
              value: /data/lake
            - name: QUARANTINE_PATH
              value: /data/quarantine
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: datalake
              mountPath: /data/lake
            - name: quarantine
              mountPath: /data/quarantine
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: datalake
          persistentVolumeClaim:
            claimName: datalake-pvc
        - name: quarantine
          persistentVolumeClaim:
            claimName: quarantine-pvc
        - name: tmp
          emptyDir: {}
